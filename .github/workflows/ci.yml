# Plexudo Production CI — GitHub Actions
# Runs on every push to main and every pull request.
# Does NOT require real production secrets for unit tests.
# External APIs are mocked. Secret values are injected only via GitHub Secrets.

name: Plexudo CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. STATIC ANALYSIS & SECRET SCANNING
  # ─────────────────────────────────────────────────────────────────────────────
  static-checks:
    name: Static Checks & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for secret-scan across commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install static-check dependencies
        run: pip install pyflakes bandit

      - name: pyflakes (syntax / unused imports)
        run: pyflakes backend/ || true   # report only, do not block on style

      - name: bandit security scan (OWASP A03 — Injection)
        run: |
          bandit -r backend/ \
            --skip B101,B311 \
            --severity-level medium \
            --confidence-level medium \
            -f txt \
            -o bandit_report.txt || true
          cat bandit_report.txt

      - name: Detect hardcoded credentials (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. DEPENDENCY VULNERABILITY SCAN
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: pip-audit (CVE scan)
        run: |
          pip install -r requirements.txt --quiet
          pip-audit --format=json --output=pip_audit_report.json || true
          cat pip_audit_report.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. UNIT & INTEGRATION TESTS
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite (59 tests, no real secrets)
    runs-on: ubuntu-latest

    env:
      # Test-only credentials — all mocked, no real API keys needed
      FLASK_ENV: development
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      DATABASE_URL: ""
      GROQ_API_KEY: mock-groq-key-for-ci
      GROQ_MODEL: llama-3.3-70b-versatile
      YOUTUBE_API_KEY: mock-youtube-key-for-ci
      GOOGLE_CLIENT_ID: mock-google-client-id
      GOOGLE_CLIENT_SECRET: mock-google-client-secret
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      CORS_ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v \
            --tb=short \
            --junit-xml=test-results.xml \
            -p no:cacheprovider

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. PRODUCTION STARTUP SMOKE TEST
  # ─────────────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Production Startup Smoke Test
    runs-on: ubuntu-latest
    needs: test

    env:
      FLASK_ENV: production
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'smoke-test-long-key-not-used-in-prod-x9q8z7' }}
      DATABASE_URL: ""
      GROQ_API_KEY: mock-groq-key
      YOUTUBE_API_KEY: mock-yt-key
      GOOGLE_CLIENT_ID: mock-gcid
      GOOGLE_CLIENT_SECRET: mock-gcs
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      CORS_ALLOWED_ORIGINS: "https://plexudo.vercel.app"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify app imports and config load without error
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'backend')
          # Verify settings load cleanly in production mode
          from app.core.config import settings
          assert settings.IS_PRODUCTION, 'Must be production mode'
          assert settings.SECRET_KEY != '', 'SECRET_KEY must be set'
          print('Config OK')

          # Verify no hardcoded default user in create_tables
          import ast, pathlib
          src = pathlib.Path('backend/app.py').read_text(encoding='utf-8')
          assert 'smtas2024' not in src, 'FAIL: hardcoded password found in source'
          assert 'fahad@smtas.com' not in src, 'FAIL: hardcoded email found in source'
          print('No hardcoded accounts: OK')
          "

      - name: Verify .env not committed
        run: |
          git ls-files --error-unmatch .env && echo "FAIL: .env is tracked by git" && exit 1 || echo ".env is NOT committed: OK"
          git ls-files --error-unmatch backend/.env && echo "FAIL: backend/.env is tracked by git" && exit 1 || echo "backend/.env is NOT committed: OK"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. SEO & CANONICAL VALIDATION
  # ─────────────────────────────────────────────────────────────────────────────
  seo-check:
    name: SEO, Vercel & Legal Disclosure Checks
    runs-on: ubuntu-latest
    needs: test

    env:
      FLASK_ENV: development
      SECRET_KEY: seo-ci-test-key-minimum-32-characters-long
      DATABASE_URL: ""
      GROQ_API_KEY: mock
      YOUTUBE_API_KEY: mock
      GOOGLE_CLIENT_ID: mock
      GOOGLE_CLIENT_SECRET: mock
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Phase 4 SEO/Vercel tests
        run: |
          python -m pytest tests/test_phase4_seo_vercel.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. RELEASE GATE SUMMARY
  # ─────────────────────────────────────────────────────────────────────────────
  release-gate:
    name: Final Release Gate
    runs-on: ubuntu-latest
    needs: [static-checks, dependency-scan, test, smoke-test, seo-check]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          echo "static-checks: ${{ needs.static-checks.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "smoke-test: ${{ needs.smoke-test.result }}"
          echo "seo-check: ${{ needs.seo-check.result }}"

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "RELEASE GATE FAIL: test suite did not pass"
            exit 1
          fi
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "RELEASE GATE FAIL: smoke test failed"
            exit 1
          fi
          if [[ "${{ needs.seo-check.result }}" != "success" ]]; then
            echo "RELEASE GATE FAIL: SEO checks failed"
            exit 1
          fi
          echo "RELEASE GATE: GO — all required gates passed"
